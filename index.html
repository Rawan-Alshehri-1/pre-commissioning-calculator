<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pre‑Commissioning Pricing Calculator</title>
  <style>
    :root {
      --primary: #0f4c81;
      --secondary: #f4f6f8;
      --accent: #1aa3a3;
      --text: #1f2937;
    }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--secondary);
      color: var(--text);
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
      padding: 32px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    .logo {
      width: 120px;
      height: 60px;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #6b7280;
      border-radius: 8px;
    }
    h1 {
      margin: 0;
      color: var(--primary);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .card {
      background: #fafafa;
      border-radius: 10px;
      padding: 20px;
      border: 1px solid #e5e7eb;
    }
    .card h2 {
      margin-top: 2;
      color: var(--primary);
      font-size: 18px;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }
    input,
    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }
    .results p {
      display: flex;
      justify-content: space-between;
      margin: 15px 0;
      padding-bottom: 10px;
      border-bottom: 1px dashed #e5e7eb;
    }
    .results span {
      font-weight: bold;
    }
        footer {
      text-align: center;
      margin-top: 40px;
      padding: 15px 0;
      font-size: 14px;
      color: #666;
      border-top: 1px solid #ddd;
    }
    
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="logo">
        <img src="ALIH logo.jpeg" alt="AILH Logo" style="max-width:100%; max-height:100%; object-fit:contain;" />
      </div>
      <div>
        <h1>Pre‑Commissioning Calculator</h1>
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <h2>Client Inputs</h2>
        <label>Total pipeline length (km)</label>
        <input type="number" id="pipeline" min="0" placeholder="Enter total pipeline length in km" />

        <label>Subscription duration (months)</label>
        <input type="number" id="months" min="1" placeholder="Enter subscription duration in months" />

        <label>Commissioning Type</label>
        <select id="commissioning">
          <option value="Pre-Commissioning">Pre‑Commissioning</option>
          <option value="Post-Commissioning">Post‑Commissioning</option>
        </select>
      </div>

      <div class="card results">
        <h2>Calculated Results</h2>
        <p>Execution Cycle (days) <span id="cycle">0</span></p>
        <p>Total Number of Sensors <span id="sensors">0</span></p>
        <p>Onboarding Fee (One‑time) <span id="onboarding">0</span></p>
        <p>Subscription Fee <span id="subscription">0</span></p>
      </div>
    </div>
  </div>

  <script>
    function calculate() {
      const pipeline = Number(document.getElementById('pipeline').value);
      const months = Number(document.getElementById('months').value);
      const type = document.getElementById('commissioning').value;
      if (!pipeline || !months) {
        document.getElementById('cycle').innerText = 0;
        document.getElementById('sensors').innerText = 0;
        document.getElementById('onboarding').innerText = 0;
        document.getElementById('subscription').innerText = 0;
        return;
      }
      // Execution Cycle
      const cycle = type === 'Pre-Commissioning' ? 5 : 0;

      // Total Number of Sensors
      const sensors = Math.max(4, Math.ceil(pipeline / (25 * Math.max(1, months))) * 4);

      // Sensor Multiplier
      const multiplier = sensors / 4;

      // Fees 
      const onboarding = 111268.4 * multiplier;
      const subscription = 14500 * multiplier * months;

      document.getElementById('cycle').innerText = cycle;
      document.getElementById('sensors').innerText = sensors;
      document.getElementById('onboarding').innerText = onboarding.toLocaleString();
      document.getElementById('subscription').innerText = subscription.toLocaleString();
    }

    document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', calculate));
    calculate();
  </script>
  <footer>
    ©️2025 AILH | All Rights Reserved
  </footer>
  </body>

</html>
